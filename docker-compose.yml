services:
  postgres:
    image: postgres:16-alpine
    container_name: boks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boks
      POSTGRES_PASSWORD: boks
      POSTGRES_DB: boks
    ports:
      - "5432:5432"
    volumes:
      - boks_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boks -d boks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: boks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - boks_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: boks-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - boks_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: boks-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/boks-covers || true;
      mc mb -p local/boks-ebooks || true;
      mc anonymous set download local/boks-covers;
      exit 0;
      "

volumes:
  boks_pg_data:
  boks_redis_data:
  boks_minio_data:
